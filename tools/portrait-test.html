<!doctype html>
<html><head><meta charset="utf-8"></head><body style="margin:0;background:#333">
<canvas id="c" width="1600" height="1000"></canvas>
<script src="../js/core/util.js"></script><script src="../js/core/input.js"></script><script src="../js/core/audio.js"></script><script src="../js/core/save.js"></script>
<script src="../js/gfx/art.js"></script><script src="../js/gfx/sprites.js"></script><script src="../js/gfx/creatures.js"></script><script src="../js/gfx/portraits.js"></script>
<script>
const ctx=document.getElementById('c').getContext('2d');
const who=['zab','nan','sab','filo','can','vir','ze','tiao','tete','lala','anz','biu','juca','zef','fir','luz','man','ren','cor','tra','lor'];
const ex=['neutro','feliz','bravo','surpreso','triste','determinado','pensativo','sarcastico','assustado','chorando'];
who.forEach((w,i)=>G.Portraits.draw(ctx,w,i<10?ex[i]:'neutro',10+(i%8)*160,10+Math.floor(i/8)*160,150,{t:1.3,talk:false}));
ex.forEach((e,i)=>G.Portraits.draw(ctx,'zab',e,10+i*125,520,120,{t:1.3}));
ex.forEach((e,i)=>G.Portraits.draw(ctx,'fir',e,10+i*125,650,120,{t:1.3}));
window.DONE=true;
</script></body></html>
