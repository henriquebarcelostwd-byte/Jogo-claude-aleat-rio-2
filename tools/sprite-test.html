<!doctype html>
<html><head><meta charset="utf-8"><title>sprite test</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Rye&display=swap" rel="stylesheet">
</head><body style="margin:0;background:#333">
<canvas id="c" width="1600" height="1000"></canvas>
<script src="../js/core/util.js"></script>
<script src="../js/core/input.js"></script>
<script src="../js/core/audio.js"></script>
<script src="../js/core/save.js"></script>
<script src="../js/gfx/art.js"></script>
<script src="../js/gfx/sprites.js"></script>
<script src="../js/gfx/creatures.js"></script>
<script>
const G = window.G;
const cv = document.getElementById('c'); const ctx = cv.getContext('2d');
const mode = new URLSearchParams(location.search).get('mode')||'';
const theme = new URLSearchParams(location.search).get('theme') || 'sertao';
G.setTheme(theme);
function draw(t){
  ctx.setTransform(1,0,0,1,0,0);
  G.Art.fillPaper(ctx,0,0,1600,1000,G.Pal.paper,0,0,G.Pal.negative);
  ctx.scale(1.6,1.6);
  const humans = Object.keys(G.Sprites.SPECS);
  const dirs=['down','right','up','left'];
  humans.forEach((id,i)=>{
    const x = 30 + (i%10)*95, y0 = 70 + Math.floor(i/10)*300;
    dirs.forEach((d,k)=> G.Sprites.humanoid(ctx,id,{x:x+(k%2)*40,y:y0+Math.floor(k/2)*75,dir:d,t,moving:k===1,phase:t*10}));
    ctx.fillStyle='#000'; ctx.font='10px sans-serif'; ctx.fillText(id,x-10,y0+150);
  });
  const cr = ['nanquim','lorota','bodinha','galinha','borrao','calango','urubu','mandacaruzinho','novelo','agulheira','peixe','carimbo','rascunho','letra'];
  cr.forEach((id,i)=>{ G.Creatures[id](ctx,{x:40+i*66,y:540,t,angle:-0.5,emerge:1,moving:true,phase:t*8,ch:'Ç',dir:'right'}); });
  if (mode==='boss'){ ctx.setTransform(1,0,0,1,0,0); G.Art.fillPaper(ctx,0,0,1600,1000,G.Pal.paper,0,0,G.Pal.negative); ctx.scale(1.5,1.5);
  G.Creatures.mandacaru(ctx,{x:90,y:250,t,corrupt:true,pose:'idle'});
  G.Creatures.mandacaru(ctx,{x:220,y:250,t,pose:'bloom'});
  G.Creatures.renda(ctx,{x:400,y:250,t,corrupt:true});
  G.Creatures.coronel(ctx,{x:540,y:250,t,panic:true});
  G.Creatures.prensa(ctx,{x:200,y:600,t,exposed:true,valves:[true,false,true]});
  G.Creatures.traca(ctx,{x:640,y:560,t,alt:70,scale:1});
  G.Creatures.nanquim(ctx,{x:420,y:420,t,scale:2.5,talking:true});
  }
}
document.fonts.ready.then(()=>{ draw(1.3); window.DONE=true; });
</script></body></html>
