<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#333">
<canvas id="c" width="1200" height="700"></canvas>
<script src="../js/core/util.js"></script><script src="../js/core/input.js"></script><script src="../js/core/audio.js"></script><script src="../js/core/save.js"></script>
<script src="../js/gfx/art.js"></script><script src="../js/gfx/sprites.js"></script><script src="../js/gfx/creatures.js"></script>
<script>
const ctx=document.getElementById('c').getContext('2d');
G.setTheme('sertao');
G.Art.fillPaper(ctx,0,0,1200,700,G.Pal.paper);
const ids=(new URLSearchParams(location.search).get('ids')||'zabele').split(',');
ids.forEach((id,row)=>{
 ['down','right','up','left'].forEach((d,i)=>{
  G.Sprites.humanoid(ctx,id,{x:90+i*150,y:190+row*330,dir:d,t:1.1,scale:3});
  G.Sprites.humanoid(ctx,id,{x:700+i*120,y:190+row*330,dir:d,t:1.3,scale:2.2,moving:true,phase:1.2, pose: i==3?'attack':null});
 });
 G.Sprites.humanoid(ctx,id,{x:150,y:320+row*330,dir:'down',t:1,scale:1.6,pose:'cheer'});
 G.Sprites.humanoid(ctx,id,{x:260,y:320+row*330,dir:'right',t:1,scale:1.6,pose:'kneel'});
 G.Sprites.humanoid(ctx,id,{x:370,y:320+row*330,dir:'down',t:1,scale:1.6,pose:'stamp'});
 G.Sprites.humanoid(ctx,id,{x:480,y:320+row*330,dir:'down',t:1,scale:1.6,pose:'lie'});
 G.Sprites.humanoid(ctx,id,{x:590,y:320+row*330,dir:'right',t:1,scale:1.6,pose:'sit'});
});
window.DONE=true;
</script></body></html>
